<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Gradiente dorado para el sol del escudo -->
    <linearGradient id="goldSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#75AADB"/>
      <stop offset="100%" stop-color="#B0C4DE"/>
    </linearGradient>
  </defs>

  <!-- Tres franjas horizontales iguales: Azul, Blanco, Verde -->
  <rect x="0" y="0" width="900" height="100" fill="#0066B2"/>
  <rect x="0" y="100" width="900" height="100" fill="#FFFFFF"/>
  <rect x="0" y="200" width="900" height="100" fill="#00853D"/>

  <!-- Escudo Oficial de San Ramón de la Nueva Orán (Centrado) -->
  <g transform="translate(450, 150)">
    <!-- Borde exterior dorado y marco ovalado -->
    <ellipse cx="0" cy="0" rx="68" ry="78" fill="#DAA520" stroke="#003366" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="63" ry="73" fill="#FFFFFF" stroke="#DAA520" stroke-width="1.5"/>

    <!-- Interior del Escudo -->
    <!-- Cielo -->
    <path d="M -58,0 A 58 68 0 0 1 58,0 L 58,-10 A 58 68 0 0 0 -58,-10 Z" fill="url(#skyGrad)"/>
    
    <!-- Sol Naciente con rayos -->
    <circle cx="0" cy="-10" r="22" fill="url(#goldSun)"/>
    <!-- Rayos del Sol -->
    <path d="M 0,-40 L 0,-34 M -20,-30 L -15,-26 M 20,-30 L 15,-26 M -30,-10 L -24,-10 M 30,-10 L 24,-10" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Montañas / Sierras de Zenta (Verde oscuro y Pardo) -->
    <path d="M -58,10 L -30,-12 L -5,2 L 20,-18 L 58,15 L 58,25 L -58,25 Z" fill="#2E5A27"/>
    <path d="M -35,12 L -10,-5 L 15,8 L 45,-8 L 58,18 L -58,18 Z" fill="#3B7A32" opacity="0.8"/>

    <!-- Campo Inferior (Verde Fértil y Río Bermejo/Juro) -->
    <path d="M -58,25 L 58,25 A 58 68 0 0 1 -58,25 Z" fill="#1E4D2B"/>
    <!-- Río plateado/azul que cruza el campo -->
    <path d="M -20,25 C -10,38 10,45 5,68 L -8,68 C -2,48 -18,40 -30,25 Z" fill="#4682B4"/>

    <!-- Cruz Evangelizadora en el centro -->
    <rect x="-2.5" y="-35" width="5" height="35" fill="#8B4513" rx="1"/>
    <rect x="-12" y="-28" width="24" height="4.5" fill="#8B4513" rx="1"/>

    <!-- Ramas de Laurel a los lados (Izquierda y Derecha) -->
    <path d="M -66,10 C -72,-20 -55,-50 -40,-58" fill="none" stroke="#006600" stroke-width="2"/>
    <path d="M 66,10 C 72,-20 55,-50 40,-58" fill="none" stroke="#006600" stroke-width="2"/>
    <!-- Hojas de laurel -->
    <circle cx="-58" cy="-15" r="3.5" fill="#2E8B57"/>
    <circle cx="-52" cy="-32" r="3.5" fill="#2E8B57"/>
    <circle cx="-42" cy="-46" r="3.5" fill="#2E8B57"/>
    <circle cx="58" cy="-15" r="3.5" fill="#2E8B57"/>
    <circle cx="52" cy="-32" r="3.5" fill="#2E8B57"/>
    <circle cx="42" cy="-46" r="3.5" fill="#2E8B57"/>

    <!-- Cinta con año de fundación: 31 de Agosto de 1794 -->
    <rect x="-38" y="52" width="76" height="15" fill="#F0F4F8" stroke="#003366" stroke-width="1" rx="3"/>
    <text x="0" y="63" font-family="'Times New Roman', serif" font-size="9.5" font-weight="bold" fill="#003366" text-anchor="middle">1794 • ORÁN</text>
  </g>
</svg>