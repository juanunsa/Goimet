<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
:root {
  --primary-color: #0066B2;
  --secondary-color: #00853D;
  --dark-green: #1B4332;
  --accent-gold: #DAA520;
  --bg-light: #F8FAF8;
  --text-dark: #1E293B;
  --text-muted: #64748B;
  --border-color: #E2E8F0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background-color: #ffffff;
  color: var(--text-dark);
  padding: 35px;
  line-height: 1.6;
}
h2 {
  color: var(--dark-green);
  font-size: 1.8rem;
  margin-bottom: 12px;
  border-bottom: 2px solid var(--border-color);
  padding-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
h3 {
  color: var(--primary-color);
  margin: 16px 0 8px 0;
  font-size: 1.25rem;
}
p { margin-bottom: 15px; color: #334155; text-align: justify; }
.card {
  background: #F8FAFC;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}
.badge {
  display: inline-block;
  background: #E2E8F0;
  color: #334155;
  font-size: 0.78rem;
  padding: 4px 10px;
  border-radius: 4px;
  margin-right: 6px;
  margin-bottom: 4px;
  font-family: 'Fira Code', monospace;
}
.badge-group {
  background: #DCFCE7;
  color: #166534;
  font-weight: 700;
  border: 1px solid #BBF7D0;
}
.math-box {
  background: #0F172A;
  color: #38BDF8;
  padding: 18px;
  border-radius: 8px;
  font-family: 'Fira Code', monospace;
  margin: 15px 0;
  border-left: 4px solid var(--accent-gold);
}
.staff-card {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  background: #ffffff;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.04);
}
.staff-img {
  width: 110px;
  height: 110px;
  border-radius: 10px;
  object-fit: cover;
  border: 2px solid var(--secondary-color);
  flex-shrink: 0;
}
.staff-info h3 { margin-top: 0; color: var(--dark-green); }
.staff-role { font-weight: 700; color: var(--primary-color); font-size: 0.92rem; margin-bottom: 4px; }
.staff-spec { font-size: 0.85rem; color: var(--text-muted); font-style: italic; margin-bottom: 10px; }
</style>
</head>
<body>
  <h2>🔬 Proyectos de Investigación (CIUNSa)</h2>
  <div id="proyectos-list">Cargando proyectos...</div>

  <script>
    fetch('../data/datos.json')
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('proyectos-list');
        list.innerHTML = data.proyectos.map(p => `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
              <h3 style="margin:0; color:#1B4332;">${p.titulo}</h3>
              <span class="badge" style="background:#00853D; color:#fff; font-weight:700;">${p.estado}</span>
            </div>
            <p style="margin-top:6px; font-weight:600; color:#0066B2;">${p.categoria}</p>
            <p style="margin-top:10px;">${p.descripcion}</p>
            <div style="margin-top:12px;">
              <small><strong>Marcos y Herramientas:</strong></small><br> 
              ${p.tecnologias.map(t => `<span class="badge">${t}</span>`).join('')}
            </div>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
