<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
:root {
  --primary-color: #0066B2;
  --secondary-color: #00853D;
  --dark-green: #1B4332;
  --accent-gold: #DAA520;
  --bg-light: #F8FAF8;
  --text-dark: #1E293B;
  --text-muted: #64748B;
  --border-color: #E2E8F0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background-color: #ffffff;
  color: var(--text-dark);
  padding: 35px;
  line-height: 1.6;
}
h2 {
  color: var(--dark-green);
  font-size: 1.8rem;
  margin-bottom: 12px;
  border-bottom: 2px solid var(--border-color);
  padding-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}
h3 {
  color: var(--primary-color);
  margin: 16px 0 8px 0;
  font-size: 1.25rem;
}
p { margin-bottom: 15px; color: #334155; text-align: justify; }
.card {
  background: #F8FAFC;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}
.badge {
  display: inline-block;
  background: #E2E8F0;
  color: #334155;
  font-size: 0.78rem;
  padding: 4px 10px;
  border-radius: 4px;
  margin-right: 6px;
  margin-bottom: 4px;
  font-family: 'Fira Code', monospace;
}
.badge-group {
  background: #DCFCE7;
  color: #166534;
  font-weight: 700;
  border: 1px solid #BBF7D0;
}
.math-box {
  background: #0F172A;
  color: #38BDF8;
  padding: 18px;
  border-radius: 8px;
  font-family: 'Fira Code', monospace;
  margin: 15px 0;
  border-left: 4px solid var(--accent-gold);
}
.staff-card {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  background: #ffffff;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.04);
}
.staff-img {
  width: 110px;
  height: 110px;
  border-radius: 10px;
  object-fit: cover;
  border: 2px solid var(--secondary-color);
  flex-shrink: 0;
}
.staff-info h3 { margin-top: 0; color: var(--dark-green); }
.staff-role { font-weight: 700; color: var(--primary-color); font-size: 0.92rem; margin-bottom: 4px; }
.staff-spec { font-size: 0.85rem; color: var(--text-muted); font-style: italic; margin-bottom: 10px; }
</style>
</head>
<body>
  <div id="content">Cargando...</div>
  <script>
    fetch('../data/datos.json')
      .then(res => res.json())
      .then(data => {
        const inst = data.institucion;
        document.getElementById('content').innerHTML = `
          <h2>🎯 Misión y Visión Institucional</h2>
          
          <div class="card" style="margin-top:20px; border-left: 5px solid #00853D;">
            <h3>Nuestra Misión</h3>
            <p style="font-size: 1.05rem;">${inst.mision}</p>
          </div>

          <div class="card" style="border-left: 5px solid #0066B2;">
            <h3>Nuestra Visión</h3>
            <p style="font-size: 1.05rem;">${inst.vision}</p>
          </div>

          <div class="card">
            <h3>Ejes de Acción y Fundamentos</h3>
            <ul>
              <li style="margin-left:20px; margin-bottom:8px;"><strong>Investigación Situada:</strong> Abordaje de la enseñanza matemática respondiendo a las demandas y características socioterritoriales del Departamento Orán y la región.</li>
              <li style="margin-left:20px; margin-bottom:8px;"><strong>Rigor Teórico y Didáctico:</strong> Utilización del marco de la Teoría Antropológica de lo Didáctico (TAD) para analizar el aprendizaje y la autonomía.</li>
              <li style="margin-left:20px; margin-bottom:8px;"><strong>Formación e Integración:</strong> Participación activa de docentes-investigadores, graduados y estudiantes en proyectos acreditados por el CIUNSa.</li>
            </ul>
          </div>
        `;
      });
  </script>
</body>
</html>
